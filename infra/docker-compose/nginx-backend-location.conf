# Shared backend routing — task 0020. Factored out of nginx.conf's port-80
# server block so the port-443 (TLS) server block added for
# api.oxo-date.dev.oxohive.com can `include` the exact same
# location/regex/proxy_pass rules instead of duplicating them (avoids the
# two copies drifting apart over time). Exact same prefixes as before:
# services/backend/packages/api/main.py.
location ~ ^/(health|auth|onboarding|profiles|location|discovery|likes|matches|blocks|reports|conversations|subscriptions|verification|notifications|admin|docs|redoc|openapi\.json)(/.*)?$ {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
