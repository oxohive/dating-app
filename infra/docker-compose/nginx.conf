# Minimal reverse proxy: all traffic -> the backend FastAPI service.
#
# Headers are forwarded as nginx receives them by default (nginx does not
# strip unrecognized request headers); this config only adds the standard
# proxy headers below and does not remove or rewrite anything else, so the
# application's own X-Correlation-ID request header passes through to the
# backend untouched.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
