# Reverse proxy for the pilot stack (task 0013 adds admin-web and
# marketing-site to what was previously "all traffic -> backend"; task
# 0020 adds a TLS-terminating port 443 for api.oxo-date.dev.oxohive.com).
#
# Headers are forwarded as nginx receives them by default (nginx does not
# strip unrecognized request headers); this config only adds the standard
# proxy headers below and does not remove or rewrite anything else, so the
# application's own X-Correlation-ID request header passes through to the
# backend untouched.
#
# Routing:
#   - Port 80 (public): the backend FastAPI app keeps exactly the same set
#     of path prefixes it already answered on before this change (listed in
#     services/backend/packages/api/main.py) — nothing about existing API
#     routing shifts or breaks. Every other path on port 80 (chiefly `/`)
#     now falls through to marketing-site, the public-facing site. Left
#     serving plain HTTP (no redirect to 443) deliberately — see the task
#     0020 comment below the server blocks.
#   - Port 443 (public, task 0020): TLS for api.oxo-date.dev.oxohive.com
#     only, terminating a real Let's Encrypt certificate and proxying to
#     the exact same backend routes as port 80 (shared via `include`, not
#     duplicated — see nginx-backend-location.conf). Added because
#     admin-web now runs on Vercel (HTTPS-only) and browsers block it
#     calling a plain-HTTP backend as mixed content; this gives the
#     backend a real HTTPS endpoint to be called at instead.
#   - Port 8081 (public, separate port): admin-web. A distinct port was
#     chosen over a `/admin/` path prefix specifically to avoid Next.js
#     basePath/asset-path pitfalls (e.g. `/_next/static/...` 404s) — admin-
#     web's own next.config.js needs no basePath this way, and this nginx
#     config needs no path rewriting either.
#   - Admin-web is reachable on a public port, but it is not
#     unauthenticated: its own application layer gates every page behind a
#     stored admin access token (src/features/auth/components/
#     RequireAdminAuth.tsx), and — the real enforcement boundary — every
#     backend /admin/* endpoint itself checks `is_admin` server-side
#     regardless of what the client sends. nginx here is just a dumb proxy
#     in front of both of those, same as it always was for the backend.

server {
    listen 80;
    server_name _;

    # Docker Compose's embedded DNS (127.0.0.11) with a short TTL, combined
    # with the `set` + variable `proxy_pass` pattern below, forces nginx to
    # re-resolve each service name on every request instead of caching the
    # container IP once at config-load/startup time. Without this, a
    # backend-only container recreation (a normal code deploy that doesn't
    # touch nginx) leaves nginx permanently routing to the old, now-dead
    # container IP — every request 502s until nginx itself is restarted.
    # A bare `proxy_pass http://service:port;` resolves once even with a
    # `resolver` directive present elsewhere; only the variable form below
    # resolves per-request. See task 0015.
    resolver 127.0.0.11 valid=10s;

    # Task 0020: ACME HTTP-01 challenge path for certbot's webroot plugin
    # (webroot shared with the host's certbot run via a volume — see
    # docker-compose.pilot.yml). Let's Encrypt's validator always makes a
    # bare HTTP request here, never HTTPS, so this has no 443 equivalent
    # and must stay reachable on plain port 80 for certbot's renewals to
    # keep working.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Backend FastAPI routes — exact prefixes from
    # services/backend/packages/api/main.py (health, every feature's own
    # prefix, plus messaging/safety's bare routes and FastAPI's
    # auto-generated docs). Matches the prefix itself and anything nested
    # under it. Shared with the port-443 server block below via `include`
    # (see nginx-backend-location.conf) rather than duplicated.
    include /etc/nginx/conf.d/includes/backend-location.conf;

    # Everything else (the public marketing site, including `/` and its
    # own Next.js static assets under /_next/static/...).
    location / {
        set $marketing_site_upstream http://marketing-site:3000;
        proxy_pass $marketing_site_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Task 0020: TLS termination for api.oxo-date.dev.oxohive.com only — the
# backend's new HTTPS endpoint for browser-based clients (admin-web on
# Vercel, and potentially marketing-site later) that can't call a plain-
# HTTP address due to mixed-content blocking. Proxies to the exact same
# `backend` upstream as the port-80 block above, via the same shared
# include, so routing can't drift between the two. Certificate obtained
# via certbot (webroot plugin, HTTP-01 challenge through the port-80
# location above) and renewed automatically by certbot's systemd timer —
# see docs/runbooks/env-start-stop.md.
#
# Deliberately NOT adding a port 80 -> 443 redirect here: apps/mobile's
# wake-discovery flow (lambda/env-wake) still constructs and calls plain
# http://<ip> URLs directly against this instance, which a hard redirect
# would break. Port 80 keeps serving plain HTTP unchanged; port 443 is an
# addition, not a replacement.
server {
    listen 443 ssl;
    server_name api.oxo-date.dev.oxohive.com;

    resolver 127.0.0.11 valid=10s;

    ssl_certificate     /etc/letsencrypt/live/api.oxo-date.dev.oxohive.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.oxo-date.dev.oxohive.com/privkey.pem;

    include /etc/nginx/conf.d/includes/backend-location.conf;
}

server {
    listen 8081;
    server_name _;

    # See the comment on the `resolver` directive in the port-80 server
    # block above — same stale-DNS fix, applied to the admin-web upstream.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $admin_web_upstream http://admin-web:3000;
        proxy_pass $admin_web_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
