# Pilot Docker Compose stack — postgres/postgis, redis, backend, celery
# worker, admin-web, marketing-site, nginx.
#
# Rendered/deployed by .github/workflows/deploy.yml's deploy job: this file,
# nginx.conf, and a runtime-only .env.pilot (never committed) are synced from
# S3 onto the pilot EC2 instance at /opt/dating-app, then run with
# `docker compose -f docker-compose.pilot.yml --env-file .env.pilot up -d`.
#
# BACKEND_IMAGE/ADMIN_WEB_IMAGE/MARKETING_SITE_IMAGE are intentionally not
# hardcoded here — each is set per-deploy in .env.pilot to the immutable
# sha-tagged ECR image built earlier in the same CI run (never `latest`), so
# every deploy is reproducible and rollback-able by re-running the workflow
# against an older commit/tag.
#
# admin-web and marketing-site are NOT given a `ports:` mapping, same as
# backend — nginx is the single public entry point (task 0013): marketing-
# site is proxied at `/` and admin-web on its own port (8081), both reached
# over the compose network at their service name (admin-web:3000,
# marketing-site:3000). See ./nginx.conf.

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${REDIS_URL}
      CELERY_RESULT_BACKEND: ${REDIS_URL}
      # Task 0019: OTP SMS delivery (Twilio primary, TextBee
      # temporary/testing-only fallback). TWILIO_ACCOUNT_SID has no SSM
      # parameter yet, so .env.pilot renders it empty -- otp_service.py
      # treats that as "skip Twilio, use TextBee" and never errors.
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER}
      TEXTBEE_DEVICE_ID: ${TEXTBEE_DEVICE_ID}
      TEXTBEE_API_KEY: ${TEXTBEE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Not publicly exposed — no `ports:` mapping. Only reachable from other
    # compose services (nginx) via the default compose network, at
    # backend:8000.

  celery-worker:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    command: ["celery", "-A", "workers.celery_app.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${REDIS_URL}
      CELERY_RESULT_BACKEND: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  admin-web:
    image: ${ADMIN_WEB_IMAGE}
    restart: unless-stopped
    # NEXT_PUBLIC_API_BASE_URL is baked into admin-web's client JS bundle at
    # image-build time (see apps/admin-web/Dockerfile) — there is no runtime
    # env var to set here for it. This service has no `environment:` block
    # for that reason.
    depends_on:
      - backend
    # Not publicly exposed — no `ports:` mapping; reachable from nginx only,
    # at admin-web:3000 on the compose network.

  marketing-site:
    image: ${MARKETING_SITE_IMAGE}
    restart: unless-stopped
    # Not publicly exposed — no `ports:` mapping; reachable from nginx only,
    # at marketing-site:3000 on the compose network.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "8081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - admin-web
      - marketing-site

volumes:
  postgres_data:
  redis_data:
