name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  check-ready:
    name: Check infra readiness
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required AWS secrets/vars
        id: check
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ] || [ -z "$EC2_INSTANCE_ID" ]; then
            echo "Infra not yet provisioned (see tasks/0002-aws-pilot-infra) — skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Required secrets/vars present — proceeding with deploy."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to pilot EC2
    needs: check-ready
    if: needs.check-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for GitHub OIDC -> AWS role assumption
      contents: read
    env:
      AWS_REGION: ap-south-1
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      # ECR_REPOSITORY / ECR_REGISTRY reference the backend image repo, which
      # the infra task (infra/**) provisions. Referenced here ahead of that
      # infra existing — this job is gated by check-ready above, so it never
      # runs until those vars are actually set.
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      # Confirmed live via `terraform output artifact_bucket_id` in
      # infra/terraform/envs/pilot (task 0003). Deploy assets (compose file,
      # nginx conf, rendered .env.pilot) are staged under deploy/ here, then
      # synced onto the instance by the final deploy step below.
      ARTIFACT_BUCKET: oxohive-dating-app-pilot-artifacts-767398004313
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # No long-lived AWS access keys are used anywhere in this repo —
          # the deploy role is assumed via GitHub's OIDC provider.

      - name: Check current EC2 instance state
        id: ec2-state
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

      - name: Start EC2 instance if stopped
        if: steps.ec2-state.outputs.state == 'stopped'
        run: |
          aws ec2 start-instances --instance-ids "$EC2_INSTANCE_ID"
          aws ec2 wait instance-running --instance-ids "$EC2_INSTANCE_ID"

      - name: Wait for SSM agent to be reachable
        if: steps.ec2-state.outputs.state == 'stopped'
        run: |
          # Freshly-started instances take a little longer than
          # "running" for the SSM agent to register as "Online".
          for i in $(seq 1 15); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "Unknown")
            if [ "$STATUS" = "Online" ]; then
              echo "SSM agent online."
              break
            fi
            echo "Waiting for SSM agent ($i/15)..."
            sleep 10
          done

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        id: build-push
        working-directory: services/backend
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f deploy/Dockerfile -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Fetch pilot DB password from SSM
        id: db-password
        run: |
          VALUE=$(aws ssm get-parameter \
            --name /dating-app/pilot/db_password \
            --with-decryption \
            --query Parameter.Value \
            --output text \
            --region "$AWS_REGION")
          echo "::add-mask::$VALUE"
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Render .env.pilot
        env:
          POSTGRES_DB: dating_app
          POSTGRES_USER: dating_app
          POSTGRES_PASSWORD: ${{ steps.db-password.outputs.value }}
          # Same REGISTRY/IMAGE_TAG this job already built and pushed above —
          # read back from that step's outputs rather than redefined here.
          REGISTRY: ${{ steps.build-push.outputs.registry }}
          IMAGE_TAG: ${{ steps.build-push.outputs.image_tag }}
        run: |
          cat > "$RUNNER_TEMP/.env.pilot" <<EOF
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
          REDIS_URL=redis://redis:6379/0
          BACKEND_IMAGE=${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          EOF

      - name: Upload deploy assets to S3
        run: |
          aws s3 cp infra/docker-compose/docker-compose.pilot.yml \
            "s3://$ARTIFACT_BUCKET/deploy/docker-compose.pilot.yml"
          aws s3 cp infra/docker-compose/nginx.conf \
            "s3://$ARTIFACT_BUCKET/deploy/nginx.conf"
          aws s3 cp "$RUNNER_TEMP/.env.pilot" \
            "s3://$ARTIFACT_BUCKET/deploy/.env.pilot"

      - name: Pull and restart Docker Compose stack on instance
        env:
          # Same REGISTRY this job already logged in to and pushed to above
          # (ecr-login / build-push steps) — read back from its output
          # rather than redefined here, so the instance logs in to the
          # exact same registry the image was pushed to.
          REGISTRY: ${{ steps.build-push.outputs.registry }}
        run: |
          # AWS-RunShellScript concatenates every string in `commands` into
          # one generated script file and runs it as a single bash
          # invocation — but WITHOUT `set -e`, a failed command inside it
          # does not abort the rest, so a later command that succeeds on its
          # own (e.g. `docker image prune -f`) still yields an overall
          # Status of "Success". That's exactly how a prior bug (the AWS CLI
          # missing from the instance, so `aws s3 sync` failed) was masked
          # as a successful deploy. Prepending `set -e` as the first command
          # makes the first failing command abort the whole script, so the
          # invocation's Status genuinely reflects the deploy's outcome.
          #
          # The ECR login below is also required for `docker compose pull`
          # to succeed on the instance: aws-actions/amazon-ecr-login@v2
          # above only authenticates the GitHub Actions *runner* that
          # builds/pushes the image — the EC2 instance's own Docker daemon
          # has never logged in to ECR, so without this it fails with
          # "pull access denied ... no basic auth credentials". The
          # instance role now has the ecr:GetAuthorizationToken /
          # BatchGetImage / GetDownloadUrlForLayer / BatchCheckLayerAvailability
          # permissions this needs (infra/terraform/envs/pilot/main.tf).
          #
          # Deploy-asset staging uses `aws s3 cp` per file, not `aws s3
          # sync`: discovered via real-world failure (task 0008 integration
          # verification) that `sync`'s default change-detection (file size
          # plus mtime) silently skips re-downloading `.env.pilot` on every
          # single deploy, because its only ever-changing field
          # (BACKEND_IMAGE's tag) is always a same-length 40-char git SHA,
          # so the file's size never changes between deploys. That left the
          # instance running a stale image for an unknown number of past
          # "successful" deploys with no error at all -- `sync` doesn't
          # print anything when it decides nothing needs updating, so this
          # was invisible in every prior deploy log. `cp` always
          # unconditionally overwrites, with no stale-skip possible.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "dating-app deploy ${{ github.sha }}" \
            --parameters 'commands=[
              "set -e",
              "mkdir -p /opt/dating-app",
              "aws s3 cp s3://'"$ARTIFACT_BUCKET"'/deploy/docker-compose.pilot.yml /opt/dating-app/docker-compose.pilot.yml",
              "aws s3 cp s3://'"$ARTIFACT_BUCKET"'/deploy/nginx.conf /opt/dating-app/nginx.conf",
              "aws s3 cp s3://'"$ARTIFACT_BUCKET"'/deploy/.env.pilot /opt/dating-app/.env.pilot",
              "cd /opt/dating-app",
              "aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"$REGISTRY"'",
              "docker compose -f docker-compose.pilot.yml --env-file .env.pilot pull",
              "docker compose -f docker-compose.pilot.yml --env-file .env.pilot up -d",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" || true

          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID")
          echo "$INVOCATION"

          STATUS=$(echo "$INVOCATION" | jq -r '.Status')
          echo "SSM command status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy SSM command did not succeed (Status=$STATUS)."
            echo "--- StandardErrorContent ---"
            echo "$INVOCATION" | jq -r '.StandardErrorContent'
            echo "--- StandardOutputContent ---"
            echo "$INVOCATION" | jq -r '.StandardOutputContent'
            exit 1
          fi

  deploy-skipped:
    name: Deploy skipped (infra not provisioned)
    needs: check-ready
    if: needs.check-ready.outputs.ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report skip reason
        run: |
          echo "Infra not yet provisioned (see tasks/0002-aws-pilot-infra) — skipping deploy."
